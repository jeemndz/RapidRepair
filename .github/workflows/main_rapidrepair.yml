name: Build and deploy PHP app to Azure Web App - RapidRepair

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Check PHP version
        run: php -v

      - name: Install composer dependencies if composer.json exists
        run: |
          if [ -f composer.json ]; then
            composer validate --no-check-publish
            composer install --prefer-dist --no-progress --no-dev --optimize-autoloader
          else
            echo "No composer.json found. Skipping composer install."
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C36C48DB3A114592BE035B84B7527667 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_44478D85DC364FB28F13825B931EC8BB }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C168584ED7D446E2AD09AD9674756E17 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: RapidRepair
          slot-name: Production
          package: .
